description: Alphina Therapeutics is a New Haven, Connecticut precision-oncology biotechnology company
  founded by experts in DNA repair and metabolic lethality. It develops next-generation antibody-drug
  conjugates (ADCs) that deliver potent NAMPT inhibitor payloads directly to tumors, designed to kill
  both dividing and non-dividing cancer cells, and pairs them with a proprietary companion diagnostic
  that identifies the patients most likely to respond. The company is venture-backed by Canaan Partners.
  It was surfaced as a portfolio company and added to the API Evangelist network as a stub; it publishes
  no public developer program, API, SDK, or documentation, so no API artifacts apply at this time.
